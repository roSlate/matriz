<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="Arial, Helvetica, sans-serif">
  <title>Matriz: dashboard wireframe (low fidelity)</title>
  <desc>Dashboard screen: the user's projects with role, task counts per status and progress. All names and numbers are sample data.</desc>

  <rect width="1280" height="800" fill="#f2f2f2"/>

  <!-- ============ MAIN SCREEN ============ -->
  <rect x="20" y="20" width="880" height="470" fill="#ffffff" stroke="#444" stroke-width="2"/>

  <!-- Header -->
  <rect x="20" y="20" width="880" height="60" fill="#e6e6e6" stroke="#444" stroke-width="2"/>
  <text x="40" y="58" font-size="22" font-weight="bold" fill="#222">Matriz</text>
  <text x="590" y="55" font-size="13" fill="#222">Ana Silva  (ana@example.org)</text>
  <rect x="790" y="40" width="90" height="28" rx="4" fill="#ffffff" stroke="#444"/>
  <text x="835" y="59" font-size="13" text-anchor="middle" fill="#222">Log out</text>

  <!-- Title row -->
  <text x="40" y="125" font-size="22" font-weight="bold" fill="#222">My projects</text>
  <rect x="40" y="145" width="360" height="36" rx="4" fill="#ffffff" stroke="#444"/>
  <text x="54" y="168" font-size="13" fill="#888">Search projects by name</text>
  <rect x="740" y="145" width="140" height="36" rx="4" fill="#cfcfcf" stroke="#444"/>
  <text x="810" y="168" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">+ New project</text>

  <!-- Card 1: Owner, computed progress -->
  <rect x="40" y="205" width="250" height="210" rx="6" fill="#ffffff" stroke="#444" stroke-width="1.5"/>
  <text x="56" y="235" font-size="15" font-weight="bold" fill="#222">Website redesign</text>
  <rect x="56" y="245" width="64" height="22" rx="11" fill="#dcdcdc" stroke="#444"/>
  <text x="88" y="261" font-size="12" text-anchor="middle" fill="#222">Owner</text>
  <rect x="56" y="285" width="68" height="50" fill="#f7f7f7" stroke="#444"/>
  <text x="90" y="302" font-size="11" text-anchor="middle" fill="#222">To do</text>
  <text x="90" y="325" font-size="18" font-weight="bold" text-anchor="middle" fill="#222">4</text>
  <rect x="130" y="285" width="68" height="50" fill="#f7f7f7" stroke="#444"/>
  <text x="164" y="302" font-size="11" text-anchor="middle" fill="#222">In progress</text>
  <text x="164" y="325" font-size="18" font-weight="bold" text-anchor="middle" fill="#222">2</text>
  <rect x="204" y="285" width="68" height="50" fill="#f7f7f7" stroke="#444"/>
  <text x="238" y="302" font-size="11" text-anchor="middle" fill="#222">Done</text>
  <text x="238" y="325" font-size="18" font-weight="bold" text-anchor="middle" fill="#222">6</text>
  <text x="56" y="362" font-size="13" fill="#222">Progress: 50%</text>
  <rect x="56" y="370" width="218" height="12" fill="#eeeeee" stroke="#444"/>
  <rect x="56" y="370" width="109" height="12" fill="#888"/>

  <!-- Card 2: Member, manual progress -->
  <rect x="315" y="205" width="250" height="210" rx="6" fill="#ffffff" stroke="#444" stroke-width="1.5"/>
  <text x="331" y="235" font-size="15" font-weight="bold" fill="#222">Client onboarding</text>
  <rect x="331" y="245" width="74" height="22" rx="11" fill="#dcdcdc" stroke="#444"/>
  <text x="368" y="261" font-size="12" text-anchor="middle" fill="#222">Member</text>
  <rect x="331" y="285" width="68" height="50" fill="#f7f7f7" stroke="#444"/>
  <text x="365" y="302" font-size="11" text-anchor="middle" fill="#222">To do</text>
  <text x="365" y="325" font-size="18" font-weight="bold" text-anchor="middle" fill="#222">3</text>
  <rect x="405" y="285" width="68" height="50" fill="#f7f7f7" stroke="#444"/>
  <text x="439" y="302" font-size="11" text-anchor="middle" fill="#222">In progress</text>
  <text x="439" y="325" font-size="18" font-weight="bold" text-anchor="middle" fill="#222">1</text>
  <rect x="479" y="285" width="68" height="50" fill="#f7f7f7" stroke="#444"/>
  <text x="513" y="302" font-size="11" text-anchor="middle" fill="#222">Done</text>
  <text x="513" y="325" font-size="18" font-weight="bold" text-anchor="middle" fill="#222">2</text>
  <text x="331" y="362" font-size="13" fill="#222">Progress: 80% (manual)</text>
  <text x="331" y="400" font-size="11" fill="#555">Computed from tasks: 33%</text>
  <rect x="331" y="370" width="218" height="12" fill="#eeeeee" stroke="#444"/>
  <rect x="331" y="370" width="174" height="12" fill="#888"/>

  <!-- Card 3: Viewer, no tasks -->
  <rect x="590" y="205" width="250" height="210" rx="6" fill="#ffffff" stroke="#444" stroke-width="1.5"/>
  <text x="606" y="235" font-size="15" font-weight="bold" fill="#222">Team handbook</text>
  <rect x="606" y="245" width="64" height="22" rx="11" fill="#dcdcdc" stroke="#444"/>
  <text x="638" y="261" font-size="12" text-anchor="middle" fill="#222">Viewer</text>
  <rect x="606" y="285" width="68" height="50" fill="#f7f7f7" stroke="#444"/>
  <text x="640" y="302" font-size="11" text-anchor="middle" fill="#222">To do</text>
  <text x="640" y="325" font-size="18" font-weight="bold" text-anchor="middle" fill="#222">0</text>
  <rect x="680" y="285" width="68" height="50" fill="#f7f7f7" stroke="#444"/>
  <text x="714" y="302" font-size="11" text-anchor="middle" fill="#222">In progress</text>
  <text x="714" y="325" font-size="18" font-weight="bold" text-anchor="middle" fill="#222">0</text>
  <rect x="754" y="285" width="68" height="50" fill="#f7f7f7" stroke="#444"/>
  <text x="788" y="302" font-size="11" text-anchor="middle" fill="#222">Done</text>
  <text x="788" y="325" font-size="18" font-weight="bold" text-anchor="middle" fill="#222">0</text>
  <text x="606" y="362" font-size="13" fill="#222">Progress: 0%</text>
  <text x="606" y="400" font-size="11" fill="#555">No tasks yet</text>
  <rect x="606" y="370" width="218" height="12" fill="#eeeeee" stroke="#444"/>

  <!-- Pagination -->
  <text x="40" y="460" font-size="13" fill="#222">Showing 3 of 3 projects</text>
  <rect x="640" y="442" width="70" height="26" rx="4" fill="#f7f7f7" stroke="#999"/>
  <text x="675" y="460" font-size="13" text-anchor="middle" fill="#999">Prev</text>
  <text x="775" y="460" font-size="13" text-anchor="middle" fill="#222">Page 1 of 1</text>
  <rect x="830" y="442" width="50" height="26" rx="4" fill="#f7f7f7" stroke="#999"/>
  <text x="855" y="460" font-size="13" text-anchor="middle" fill="#999">Next</text>

  <!-- ============ CALLOUT MARKERS ============ -->
  <g font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">
    <circle cx="560" cy="50" r="11" fill="#c0392b"/><text x="560" y="55">1</text>
    <circle cx="418" cy="163" r="11" fill="#c0392b"/><text x="418" y="168">2</text>
    <circle cx="722" cy="163" r="11" fill="#c0392b"/><text x="722" y="168">3</text>
    <circle cx="270" cy="217" r="11" fill="#c0392b"/><text x="270" y="222">4</text>
    <circle cx="140" cy="256" r="11" fill="#c0392b"/><text x="140" y="261">5</text>
    <circle cx="283" cy="310" r="11" fill="#c0392b"/><text x="283" y="315">6</text>
    <circle cx="200" cy="358" r="11" fill="#c0392b"/><text x="200" y="363">7</text>
    <circle cx="610" cy="455" r="11" fill="#c0392b"/><text x="610" y="460">8</text>
  </g>

  <!-- ============ LEGEND ============ -->
  <rect x="920" y="20" width="340" height="470" fill="#ffffff" stroke="#444"/>
  <text x="936" y="46" font-size="15" font-weight="bold" fill="#222">What each part is for</text>
  <g font-size="12" fill="#222">
    <text x="936" y="76"><tspan font-weight="bold">1</tspan>  Current user and log out</text>
    <text x="954" y="92" fill="#555">FR-02, FR-03; GET /users/me</text>
    <text x="936" y="122"><tspan font-weight="bold">2</tspan>  Search projects by name</text>
    <text x="954" y="138" fill="#555">FR-09; query parameter "search"</text>
    <text x="936" y="168"><tspan font-weight="bold">3</tspan>  Create a project</text>
    <text x="954" y="184" fill="#555">FR-05; creator becomes the Owner</text>
    <text x="936" y="214"><tspan font-weight="bold">4</tspan>  Project card: opens the project detail</text>
    <text x="954" y="230" fill="#555">AC-06.4; only accessible projects (AC-06.1)</text>
    <text x="936" y="260"><tspan font-weight="bold">5</tspan>  The user's role in that project</text>
    <text x="954" y="276" fill="#555">Owner, Member or Viewer (myRole)</text>
    <text x="936" y="306"><tspan font-weight="bold">6</tspan>  Task counts per status</text>
    <text x="954" y="322" fill="#555">FR-23, AC-06.2; over all tasks, not one page</text>
    <text x="936" y="352"><tspan font-weight="bold">7</tspan>  Progress bar and percentage</text>
    <text x="954" y="368" fill="#555">FR-24, FR-25; "manual" label when the Owner set</text>
    <text x="954" y="382" fill="#555">it, with the computed value alongside</text>
    <text x="936" y="412"><tspan font-weight="bold">8</tspan>  Pagination</text>
    <text x="954" y="428" fill="#555">Contract: page and size (default 20)</text>
    <text x="936" y="462" font-weight="bold">Data: GET /projects (one call).</text>
    <text x="936" y="478" fill="#555">All names and numbers are sample data.</text>
  </g>

  <!-- ============ OTHER STATES ============ -->
  <text x="20" y="530" font-size="16" font-weight="bold" fill="#222">Other states of this screen</text>

  <rect x="20" y="545" width="400" height="235" fill="#ffffff" stroke="#444" stroke-width="1.5"/>
  <text x="36" y="570" font-size="14" font-weight="bold" fill="#222">Loading</text>
  <rect x="36" y="585" width="108" height="110" fill="#e6e6e6" stroke="#bbb" stroke-dasharray="4 3"/>
  <rect x="156" y="585" width="108" height="110" fill="#e6e6e6" stroke="#bbb" stroke-dasharray="4 3"/>
  <rect x="276" y="585" width="108" height="110" fill="#e6e6e6" stroke="#bbb" stroke-dasharray="4 3"/>
  <text x="36" y="725" font-size="12" fill="#222">Grey placeholders while the request is running.</text>
  <text x="36" y="742" font-size="12" fill="#222">The search box and "New project" are disabled.</text>

  <rect x="440" y="545" width="400" height="235" fill="#ffffff" stroke="#444" stroke-width="1.5"/>
  <text x="456" y="570" font-size="14" font-weight="bold" fill="#222">Empty (AC-06.5)</text>
  <text x="640" y="635" font-size="15" text-anchor="middle" fill="#222">You have no projects yet.</text>
  <rect x="560" y="655" width="160" height="34" rx="4" fill="#cfcfcf" stroke="#444"/>
  <text x="640" y="677" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Create your first project</text>
  <text x="456" y="742" font-size="12" fill="#222">Shown when the user has no project, or a search finds none</text>
  <text x="456" y="758" font-size="12" fill="#222">(then: "No projects match your search").</text>

  <rect x="860" y="545" width="400" height="235" fill="#ffffff" stroke="#444" stroke-width="1.5"/>
  <text x="876" y="570" font-size="14" font-weight="bold" fill="#222">Error</text>
  <text x="1060" y="635" font-size="15" text-anchor="middle" fill="#222">Could not load your projects.</text>
  <rect x="990" y="655" width="140" height="34" rx="4" fill="#cfcfcf" stroke="#444"/>
  <text x="1060" y="677" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Try again</text>
  <text x="876" y="742" font-size="12" fill="#222">A plain message, no technical details (CC-02).</text>
  <text x="876" y="758" font-size="12" fill="#222">If the session has expired: go to login (AC-01.5).</text>
</svg>
