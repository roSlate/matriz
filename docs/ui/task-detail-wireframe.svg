<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" font-family="Arial, Helvetica, sans-serif">
  <title>Matriz: task detail wireframe (low fidelity)</title>
  <desc>Task detail screen, as seen by an Owner or Member: task data, status and priority, assignees and comments. All names and numbers are sample data.</desc>

  <rect width="1280" height="960" fill="#f2f2f2"/>

  <!-- ============ MAIN SCREEN (Owner or Member view) ============ -->
  <rect x="20" y="20" width="880" height="640" fill="#ffffff" stroke="#444" stroke-width="2"/>

  <!-- Header -->
  <rect x="20" y="20" width="880" height="60" fill="#e6e6e6" stroke="#444" stroke-width="2"/>
  <text x="40" y="58" font-size="22" font-weight="bold" fill="#222">Matriz</text>
  <text x="590" y="55" font-size="13" fill="#222">Ana Silva  (ana@example.org)</text>
  <rect x="790" y="40" width="90" height="28" rx="4" fill="#ffffff" stroke="#444"/>
  <text x="835" y="59" font-size="13" text-anchor="middle" fill="#222">Log out</text>

  <!-- Breadcrumb -->
  <text x="40" y="105" font-size="12" fill="#555" text-decoration="underline">My projects</text>
  <text x="112" y="105" font-size="12" fill="#555">&gt;</text>
  <text x="128" y="105" font-size="12" fill="#555" text-decoration="underline">Website redesign</text>
  <text x="232" y="105" font-size="12" fill="#555">&gt;  Write the project brief</text>

  <!-- Task header -->
  <text x="40" y="150" font-size="22" font-weight="bold" fill="#222">Write the project brief</text>
  <text x="40" y="172" font-size="13" fill="#444">One page, for the client. Covers goals, scope and timeline.</text>
  <text x="40" y="192" font-size="11" fill="#777">Created 14 Nov 2026   |   Updated 15 Nov 2026</text>
  <rect x="680" y="128" width="80" height="30" rx="4" fill="#ffffff" stroke="#444"/>
  <text x="720" y="148" font-size="13" text-anchor="middle" fill="#222">Edit</text>
  <rect x="770" y="128" width="110" height="30" rx="4" fill="#ffffff" stroke="#444"/>
  <text x="825" y="148" font-size="13" text-anchor="middle" fill="#222">Delete task</text>
  <line x1="40" y1="208" x2="880" y2="208" stroke="#cccccc"/>

  <!-- Status and priority -->
  <text x="40" y="232" font-size="12" font-weight="bold" fill="#222">Status</text>
  <rect x="40" y="238" width="160" height="30" rx="4" fill="#ffffff" stroke="#444"/>
  <text x="50" y="258" font-size="13" fill="#222">In progress</text>
  <text x="186" y="258" font-size="11" fill="#222">v</text>
  <text x="215" y="232" font-size="12" font-weight="bold" fill="#222">Priority</text>
  <rect x="215" y="238" width="160" height="30" rx="4" fill="#ffffff" stroke="#444"/>
  <text x="225" y="258" font-size="13" fill="#222">High</text>
  <text x="361" y="258" font-size="11" fill="#222">v</text>

  <!-- Comments -->
  <text x="40" y="310" font-size="16" font-weight="bold" fill="#222">Comments (3)</text>
  <text x="520" y="310" font-size="12" fill="#777">Showing 3 of 3</text>

  <rect x="40" y="322" width="560" height="64" fill="#ffffff" stroke="#bbb"/>
  <text x="52" y="344" font-size="13" font-weight="bold" fill="#222">Ana Silva</text>
  <text x="588" y="344" font-size="11" text-anchor="end" fill="#777">14 Nov 2026, 10:15</text>
  <text x="52" y="368" font-size="13" fill="#222">Draft is ready for review.</text>

  <rect x="40" y="394" width="560" height="64" fill="#ffffff" stroke="#bbb"/>
  <text x="52" y="416" font-size="13" font-weight="bold" fill="#222">Rui Costa</text>
  <text x="588" y="416" font-size="11" text-anchor="end" fill="#777">14 Nov 2026, 15:40</text>
  <text x="52" y="440" font-size="13" fill="#222">Added the timeline section.</text>

  <rect x="40" y="466" width="560" height="64" fill="#ffffff" stroke="#bbb"/>
  <text x="52" y="488" font-size="13" font-weight="bold" fill="#222">Ana Silva</text>
  <text x="588" y="488" font-size="11" text-anchor="end" fill="#777">15 Nov 2026, 09:05</text>
  <text x="52" y="512" font-size="13" fill="#222">Waiting for the client's feedback.</text>

  <!-- Add comment -->
  <text x="40" y="556" font-size="12" font-weight="bold" fill="#222">Add a comment</text>
  <rect x="40" y="564" width="440" height="60" rx="4" fill="#ffffff" stroke="#444"/>
  <text x="50" y="584" font-size="12" fill="#888">Write a comment (1 to 2000 characters)</text>
  <rect x="490" y="564" width="110" height="30" rx="4" fill="#cfcfcf" stroke="#444"/>
  <text x="545" y="584" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Add comment</text>
  <text x="40" y="642" font-size="11" fill="#777">0 / 2000</text>

  <!-- Assignees panel -->
  <rect x="620" y="225" width="260" height="250" fill="#ffffff" stroke="#444" stroke-width="1.5"/>
  <text x="632" y="247" font-size="14" font-weight="bold" fill="#222">Assignees</text>
  <rect x="632" y="258" width="236" height="26" rx="13" fill="#f0f0f0" stroke="#444"/>
  <text x="646" y="275" font-size="13" fill="#222">Ana Silva</text>
  <text x="852" y="275" font-size="13" fill="#222">x</text>
  <rect x="632" y="292" width="236" height="26" rx="13" fill="#f0f0f0" stroke="#444"/>
  <text x="646" y="309" font-size="13" fill="#222">Rui Costa</text>
  <text x="852" y="309" font-size="13" fill="#222">x</text>
  <text x="632" y="338" font-size="12" font-weight="bold" fill="#222">Assign a user</text>
  <rect x="632" y="346" width="236" height="28" rx="4" fill="#ffffff" stroke="#444"/>
  <text x="642" y="365" font-size="12" fill="#888">Choose a member</text>
  <text x="854" y="365" font-size="10" fill="#222">v</text>
  <rect x="632" y="382" width="100" height="28" rx="4" fill="#cfcfcf" stroke="#444"/>
  <text x="682" y="401" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Assign</text>
  <text x="632" y="432" font-size="11" fill="#777">Only Owners and Members of the project</text>
  <text x="632" y="446" font-size="11" fill="#777">who are not assigned yet are offered.</text>

  <!-- ============ CALLOUT MARKERS ============ -->
  <g font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">
    <circle cx="378" cy="101" r="11" fill="#c0392b"/><text x="378" y="106">1</text>
    <circle cx="300" cy="144" r="11" fill="#c0392b"/><text x="300" y="149">2</text>
    <circle cx="668" cy="143" r="11" fill="#c0392b"/><text x="668" y="148">3</text>
    <circle cx="388" cy="253" r="11" fill="#c0392b"/><text x="388" y="258">4</text>
    <circle cx="870" cy="240" r="11" fill="#c0392b"/><text x="870" y="245">5</text>
    <circle cx="612" cy="362" r="11" fill="#c0392b"/><text x="612" y="367">6</text>
    <circle cx="170" cy="305" r="11" fill="#c0392b"/><text x="170" y="310">7</text>
    <circle cx="488" cy="557" r="11" fill="#c0392b"/><text x="488" y="562">8</text>
  </g>

  <!-- ============ LEGEND ============ -->
  <rect x="920" y="20" width="340" height="640" fill="#ffffff" stroke="#444"/>
  <text x="936" y="46" font-size="15" font-weight="bold" fill="#222">What each part is for</text>
  <g font-size="12" fill="#222">
    <text x="936" y="72"><tspan font-weight="bold">1</tspan>  Back to the project</text>
    <text x="954" y="87" fill="#555">Breadcrumb</text>
    <text x="936" y="108"><tspan font-weight="bold">2</tspan>  Title and description</text>
    <text x="954" y="123" fill="#555">GET /tasks/{taskId}; dates set by the server</text>
    <text x="936" y="144"><tspan font-weight="bold">3</tspan>  Edit and delete the task</text>
    <text x="954" y="159" fill="#555">Owner and Member; FR-16, FR-17;</text>
    <text x="954" y="173" fill="#555">delete asks to confirm</text>
    <text x="936" y="192"><tspan font-weight="bold">4</tspan>  Status and priority</text>
    <text x="954" y="207" fill="#555">FR-16; any status can change to any other,</text>
    <text x="954" y="221" fill="#555">including reopening a done task (AC-05.2)</text>
    <text x="936" y="240"><tspan font-weight="bold">5</tspan>  Assignees</text>
    <text x="954" y="255" fill="#555">FR-19; x removes one person (AC-07.2);</text>
    <text x="954" y="269" fill="#555">shows "Unassigned" when there is none (AC-07.7)</text>
    <text x="936" y="288"><tspan font-weight="bold">6</tspan>  Assign a user</text>
    <text x="954" y="303" fill="#555">FR-20, AC-07.1, AC-07.4; lists only Owners</text>
    <text x="954" y="317" fill="#555">and Members who are not assigned yet</text>
    <text x="936" y="336"><tspan font-weight="bold">7</tspan>  Comments</text>
    <text x="954" y="351" fill="#555">FR-22, AC-08.4; oldest first; author and date</text>
    <text x="954" y="365" fill="#555">come from the server</text>
    <text x="936" y="384"><tspan font-weight="bold">8</tspan>  Add a comment</text>
    <text x="954" y="399" fill="#555">FR-21, AC-08.1, AC-08.2; 1 to 2000 characters,</text>
    <text x="954" y="413" fill="#555">not only spaces; the text is kept on error</text>
  </g>
  <line x1="936" y1="432" x2="1244" y2="432" stroke="#cccccc"/>
  <text x="936" y="454" font-size="13" font-weight="bold" fill="#222">What each role sees</text>
  <g font-size="12" fill="#222">
    <text x="936" y="476"><tspan font-weight="bold">Owner, Member:</tspan>  everything on this page.</text>
    <text x="936" y="498"><tspan font-weight="bold">Viewer:</tspan>  read only. Status and priority</text>
    <text x="992" y="513">are shown as text; no Edit, Delete, x,</text>
    <text x="992" y="528">Assign or comment form (AC-08.6).</text>
    <text x="936" y="560" fill="#555">Data: GET /tasks/{taskId} and</text>
    <text x="936" y="575" fill="#555">GET /tasks/{taskId}/comments.</text>
    <text x="936" y="600" fill="#555">All names and numbers are sample data.</text>
  </g>

  <!-- ============ OTHER STATES AND DIALOGS ============ -->
  <text x="20" y="690" font-size="16" font-weight="bold" fill="#222">Other states and dialogs</text>

  <!-- A: comment validation error -->
  <rect x="20" y="705" width="400" height="235" fill="#ffffff" stroke="#444" stroke-width="1.5"/>
  <text x="36" y="730" font-size="14" font-weight="bold" fill="#222">Add comment: validation error</text>
  <rect x="36" y="745" width="340" height="60" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="46" y="768" font-size="13" fill="#222">   </text>
  <text x="36" y="822" font-size="11" fill="#c0392b">Comment must be between 1 and 2000 characters.</text>
  <rect x="36" y="834" width="120" height="28" rx="4" fill="#cfcfcf" stroke="#444"/>
  <text x="96" y="853" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Add comment</text>
  <text x="36" y="884" font-size="11" fill="#555">A text of only spaces is refused like an empty one.</text>
  <text x="36" y="900" font-size="11" fill="#555">While sending, the button is disabled ("Adding...").</text>
  <text x="36" y="916" font-size="11" fill="#555">If the request fails, the typed text is kept.</text>

  <!-- B: empty and not-found states -->
  <rect x="440" y="705" width="400" height="235" fill="#ffffff" stroke="#444" stroke-width="1.5"/>
  <text x="456" y="730" font-size="14" font-weight="bold" fill="#222">Empty and not-found states</text>
  <rect x="456" y="742" width="368" height="88" fill="#ffffff" stroke="#999" stroke-dasharray="4 3"/>
  <text x="640" y="768" font-size="13" text-anchor="middle" fill="#222">Assignees:  <tspan fill="#777">Unassigned</tspan></text>
  <text x="640" y="790" font-size="13" text-anchor="middle" fill="#222">No comments yet.</text>
  <text x="640" y="813" font-size="11" text-anchor="middle" fill="#555">A Viewer sees the same, without the form (AC-07.7).</text>
  <rect x="456" y="842" width="368" height="84" fill="#ffffff" stroke="#999" stroke-dasharray="4 3"/>
  <text x="640" y="866" font-size="13" text-anchor="middle" fill="#222">This task no longer exists, or you no longer</text>
  <text x="640" y="883" font-size="13" text-anchor="middle" fill="#222">have access to it.</text>
  <text x="640" y="908" font-size="12" text-anchor="middle" fill="#222" text-decoration="underline">Back to the project</text>

  <!-- C: delete task confirmation -->
  <rect x="860" y="705" width="400" height="235" fill="#ffffff" stroke="#444" stroke-width="1.5"/>
  <text x="876" y="730" font-size="14" font-weight="bold" fill="#222">Delete task: confirmation</text>
  <rect x="876" y="745" width="368" height="130" rx="6" fill="#f7f7f7" stroke="#444" stroke-width="2"/>
  <text x="892" y="772" font-size="14" font-weight="bold" fill="#222">Delete "Write the project brief"?</text>
  <text x="892" y="795" font-size="12" fill="#222">Its comments and assignments will be</text>
  <text x="892" y="811" font-size="12" fill="#222">permanently deleted. This cannot be undone.</text>
  <rect x="892" y="828" width="110" height="30" rx="4" fill="#cfcfcf" stroke="#444"/>
  <text x="947" y="848" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Delete task</text>
  <rect x="1012" y="828" width="80" height="30" rx="4" fill="#ffffff" stroke="#444"/>
  <text x="1052" y="848" font-size="13" text-anchor="middle" fill="#222">Cancel</text>
  <text x="876" y="900" font-size="11" fill="#555">Cancel changes nothing. A failed deletion shows an error</text>
  <text x="876" y="915" font-size="11" fill="#555">and keeps the task; it never shows a success message.</text>
</svg>
