<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="920" viewBox="0 0 1280 920" font-family="Arial, Helvetica, sans-serif">
  <title>Matriz: project detail wireframe (low fidelity)</title>
  <desc>Project detail screen, as seen by the project Owner: project header with progress, task list with filters, members panel. All names and numbers are sample data.</desc>

  <rect width="1280" height="920" fill="#f2f2f2"/>

  <!-- ============ MAIN SCREEN (Owner view) ============ -->
  <rect x="20" y="20" width="880" height="580" fill="#ffffff" stroke="#444" stroke-width="2"/>

  <!-- Header -->
  <rect x="20" y="20" width="880" height="60" fill="#e6e6e6" stroke="#444" stroke-width="2"/>
  <text x="40" y="58" font-size="22" font-weight="bold" fill="#222">Matriz</text>
  <text x="590" y="55" font-size="13" fill="#222">Ana Silva  (ana@example.org)</text>
  <rect x="790" y="40" width="90" height="28" rx="4" fill="#ffffff" stroke="#444"/>
  <text x="835" y="59" font-size="13" text-anchor="middle" fill="#222">Log out</text>

  <!-- Breadcrumb -->
  <text x="40" y="105" font-size="12" fill="#555" text-decoration="underline">My projects</text>
  <text x="112" y="105" font-size="12" fill="#555">&gt;  Website redesign</text>

  <!-- Project header -->
  <text x="40" y="150" font-size="22" font-weight="bold" fill="#222">Website redesign</text>
  <rect x="245" y="133" width="64" height="22" rx="11" fill="#dcdcdc" stroke="#444"/>
  <text x="277" y="149" font-size="12" text-anchor="middle" fill="#222">Owner</text>
  <text x="40" y="172" font-size="13" fill="#444">New landing page and style guide.</text>
  <rect x="680" y="128" width="80" height="30" rx="4" fill="#ffffff" stroke="#444"/>
  <text x="720" y="148" font-size="13" text-anchor="middle" fill="#222">Edit</text>
  <rect x="770" y="128" width="110" height="30" rx="4" fill="#ffffff" stroke="#444"/>
  <text x="825" y="148" font-size="13" text-anchor="middle" fill="#222">Delete project</text>

  <!-- Progress and counts -->
  <text x="40" y="205" font-size="13" fill="#222">Progress: 50%</text>
  <rect x="40" y="212" width="300" height="12" fill="#eeeeee" stroke="#444"/>
  <rect x="40" y="212" width="150" height="12" fill="#888"/>
  <text x="360" y="223" font-size="12" fill="#222" text-decoration="underline">Set manual progress</text>
  <text x="480" y="223" font-size="11" fill="#777">(Owner only)</text>
  <rect x="598" y="198" width="90" height="30" fill="#f7f7f7" stroke="#444"/>
  <text x="643" y="217" font-size="12" text-anchor="middle" fill="#222">To do  4</text>
  <rect x="694" y="198" width="90" height="30" fill="#f7f7f7" stroke="#444"/>
  <text x="739" y="217" font-size="12" text-anchor="middle" fill="#222">In progress  2</text>
  <rect x="790" y="198" width="90" height="30" fill="#f7f7f7" stroke="#444"/>
  <text x="835" y="217" font-size="12" text-anchor="middle" fill="#222">Done  6</text>
  <line x1="40" y1="246" x2="880" y2="246" stroke="#cccccc"/>

  <!-- Tasks section -->
  <text x="40" y="275" font-size="16" font-weight="bold" fill="#222">Tasks</text>
  <rect x="500" y="258" width="120" height="30" rx="4" fill="#cfcfcf" stroke="#444"/>
  <text x="560" y="278" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">+ New task</text>

  <rect x="40" y="298" width="140" height="30" rx="4" fill="#ffffff" stroke="#444"/>
  <text x="50" y="318" font-size="12" fill="#222">Status: All</text>
  <text x="166" y="318" font-size="11" fill="#222">v</text>
  <rect x="190" y="298" width="140" height="30" rx="4" fill="#ffffff" stroke="#444"/>
  <text x="200" y="318" font-size="12" fill="#222">Priority: All</text>
  <text x="316" y="318" font-size="11" fill="#222">v</text>
  <text x="345" y="318" font-size="12" fill="#222" text-decoration="underline">Clear filters</text>

  <!-- Table -->
  <rect x="40" y="340" width="580" height="26" fill="#e6e6e6" stroke="#444"/>
  <g font-size="12" font-weight="bold" fill="#222">
    <text x="50" y="358">Title</text>
    <text x="300" y="358">Status</text>
    <text x="405" y="358">Priority</text>
    <text x="490" y="358">Assignees</text>
  </g>

  <rect x="40" y="366" width="580" height="40" fill="#ffffff" stroke="#bbb"/>
  <text x="50" y="391" font-size="13" fill="#222">Write the project brief</text>
  <rect x="296" y="375" width="96" height="22" rx="11" fill="#dcdcdc" stroke="#444"/>
  <text x="344" y="391" font-size="11" text-anchor="middle" fill="#222">In progress</text>
  <text x="405" y="391" font-size="13" fill="#222">High</text>
  <text x="490" y="391" font-size="13" fill="#222">Ana, Rui</text>

  <rect x="40" y="406" width="580" height="40" fill="#ffffff" stroke="#bbb"/>
  <text x="50" y="431" font-size="13" fill="#222">Design the landing page</text>
  <rect x="296" y="415" width="96" height="22" rx="11" fill="#f0f0f0" stroke="#444"/>
  <text x="344" y="431" font-size="11" text-anchor="middle" fill="#222">To do</text>
  <text x="405" y="431" font-size="13" fill="#222">Medium</text>
  <text x="490" y="431" font-size="13" fill="#777">Unassigned</text>

  <rect x="40" y="446" width="580" height="40" fill="#ffffff" stroke="#bbb"/>
  <text x="50" y="471" font-size="13" fill="#222">Collect client feedback</text>
  <rect x="296" y="455" width="96" height="22" rx="11" fill="#f0f0f0" stroke="#444"/>
  <text x="344" y="471" font-size="11" text-anchor="middle" fill="#222">To do</text>
  <text x="405" y="471" font-size="13" fill="#222">Medium</text>
  <text x="490" y="471" font-size="13" fill="#222">Rui</text>

  <rect x="40" y="486" width="580" height="40" fill="#ffffff" stroke="#bbb"/>
  <text x="50" y="511" font-size="13" fill="#222">Set up the style guide</text>
  <rect x="296" y="495" width="96" height="22" rx="11" fill="#bdbdbd" stroke="#444"/>
  <text x="344" y="511" font-size="11" text-anchor="middle" fill="#222">Done</text>
  <text x="405" y="511" font-size="13" fill="#222">Low</text>
  <text x="490" y="511" font-size="13" fill="#222">Ana</text>

  <!-- Pagination -->
  <text x="40" y="553" font-size="13" fill="#222">Showing 4 of 12 tasks</text>
  <rect x="420" y="536" width="60" height="24" rx="4" fill="#f7f7f7" stroke="#999"/>
  <text x="450" y="553" font-size="13" text-anchor="middle" fill="#999">Prev</text>
  <text x="520" y="553" font-size="13" text-anchor="middle" fill="#222">Page 1 of 3</text>
  <rect x="570" y="536" width="50" height="24" rx="4" fill="#ffffff" stroke="#444"/>
  <text x="595" y="553" font-size="13" text-anchor="middle" fill="#222">Next</text>

  <!-- Members panel -->
  <rect x="640" y="258" width="240" height="310" fill="#ffffff" stroke="#444" stroke-width="1.5"/>
  <text x="652" y="282" font-size="14" font-weight="bold" fill="#222">Members</text>

  <text x="652" y="316" font-size="13" font-weight="bold" fill="#222">Ana Silva</text>
  <text x="652" y="332" font-size="11" fill="#555">ana@example.org</text>
  <rect x="800" y="300" width="62" height="20" rx="10" fill="#dcdcdc" stroke="#444"/>
  <text x="831" y="314" font-size="11" text-anchor="middle" fill="#222">Owner</text>
  <line x1="652" y1="342" x2="868" y2="342" stroke="#dddddd"/>

  <text x="652" y="366" font-size="13" font-weight="bold" fill="#222">Rui Costa</text>
  <text x="652" y="382" font-size="11" fill="#555">rui@example.org</text>
  <rect x="788" y="350" width="76" height="22" rx="4" fill="#ffffff" stroke="#444"/>
  <text x="796" y="365" font-size="11" fill="#222">Member</text>
  <text x="852" y="365" font-size="10" fill="#222">v</text>
  <text x="800" y="382" font-size="11" fill="#222" text-decoration="underline">Remove</text>
  <line x1="652" y1="392" x2="868" y2="392" stroke="#dddddd"/>

  <text x="652" y="416" font-size="13" font-weight="bold" fill="#222">Sofia Lima</text>
  <text x="652" y="432" font-size="11" fill="#555">sofia@example.org</text>
  <rect x="788" y="400" width="76" height="22" rx="4" fill="#ffffff" stroke="#444"/>
  <text x="796" y="415" font-size="11" fill="#222">Viewer</text>
  <text x="852" y="415" font-size="10" fill="#222">v</text>
  <text x="800" y="432" font-size="11" fill="#222" text-decoration="underline">Remove</text>
  <line x1="652" y1="446" x2="868" y2="446" stroke="#dddddd"/>

  <text x="652" y="468" font-size="12" font-weight="bold" fill="#222">Add member</text>
  <text x="731" y="468" font-size="11" fill="#777">(Owner only)</text>
  <rect x="652" y="478" width="216" height="28" rx="4" fill="#ffffff" stroke="#444"/>
  <text x="660" y="496" font-size="12" fill="#888">Email of an existing user</text>
  <rect x="652" y="514" width="100" height="28" rx="4" fill="#ffffff" stroke="#444"/>
  <text x="660" y="532" font-size="12" fill="#222">Member</text>
  <text x="738" y="532" font-size="10" fill="#222">v</text>
  <rect x="762" y="514" width="106" height="28" rx="4" fill="#cfcfcf" stroke="#444"/>
  <text x="815" y="532" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Add</text>

  <!-- ============ CALLOUT MARKERS ============ -->
  <g font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">
    <circle cx="232" cy="101" r="11" fill="#c0392b"/><text x="232" y="106">1</text>
    <circle cx="325" cy="144" r="11" fill="#c0392b"/><text x="325" y="149">2</text>
    <circle cx="668" cy="143" r="11" fill="#c0392b"/><text x="668" y="148">3</text>
    <circle cx="352" cy="200" r="11" fill="#c0392b"/><text x="352" y="205">4</text>
    <circle cx="586" cy="213" r="11" fill="#c0392b"/><text x="586" y="218">5</text>
    <circle cx="490" cy="273" r="11" fill="#c0392b"/><text x="490" y="278">6</text>
    <circle cx="478" cy="313" r="11" fill="#c0392b"/><text x="478" y="318">7</text>
    <circle cx="612" cy="352" r="11" fill="#c0392b"/><text x="612" y="357">8</text>
    <circle cx="866" cy="276" r="11" fill="#c0392b"/><text x="866" y="281">9</text>
    <circle cx="868" cy="466" r="11" fill="#c0392b"/><text x="868" y="471">10</text>
    <circle cx="398" cy="548" r="11" fill="#c0392b"/><text x="398" y="553">11</text>
  </g>

  <!-- ============ LEGEND ============ -->
  <rect x="920" y="20" width="340" height="580" fill="#ffffff" stroke="#444"/>
  <text x="936" y="46" font-size="15" font-weight="bold" fill="#222">What each part is for</text>
  <g font-size="12" fill="#222">
    <text x="936" y="72"><tspan font-weight="bold">1</tspan>  Back to the dashboard</text>
    <text x="954" y="87" fill="#555">Breadcrumb</text>
    <text x="936" y="106"><tspan font-weight="bold">2</tspan>  Project name, role and description</text>
    <text x="954" y="121" fill="#555">FR-06; GET /projects/{projectId}</text>
    <text x="936" y="140"><tspan font-weight="bold">3</tspan>  Edit and delete the project</text>
    <text x="954" y="155" fill="#555">Owner only; FR-07, FR-08; delete asks to confirm</text>
    <text x="936" y="174"><tspan font-weight="bold">4</tspan>  Progress</text>
    <text x="954" y="189" fill="#555">FR-24, FR-25; manual value is Owner only</text>
    <text x="936" y="208"><tspan font-weight="bold">5</tspan>  Task counts per status</text>
    <text x="954" y="223" fill="#555">FR-23; over all tasks of the project</text>
    <text x="936" y="242"><tspan font-weight="bold">6</tspan>  New task</text>
    <text x="954" y="257" fill="#555">Owner and Member; FR-14; opens the form</text>
    <text x="936" y="276"><tspan font-weight="bold">7</tspan>  Filters</text>
    <text x="954" y="291" fill="#555">FR-18, AC-09.2; status and priority combine</text>
    <text x="936" y="310"><tspan font-weight="bold">8</tspan>  Task list</text>
    <text x="954" y="325" fill="#555">Title, status, priority, assignees; a row opens</text>
    <text x="954" y="339" fill="#555">the task detail (assignees and comments; not drawn)</text>
    <text x="936" y="358"><tspan font-weight="bold">9</tspan>  Members and roles</text>
    <text x="954" y="373" fill="#555">FR-10 to FR-13; Owner changes a role or removes</text>
    <text x="936" y="392"><tspan font-weight="bold">10</tspan>  Add a member by email</text>
    <text x="954" y="407" fill="#555">Owner only; AC-03.7 error if no user has it</text>
    <text x="936" y="426"><tspan font-weight="bold">11</tspan>  Pagination</text>
    <text x="954" y="441" fill="#555">page and size; filters keep working</text>
  </g>
  <line x1="936" y1="456" x2="1244" y2="456" stroke="#cccccc"/>
  <text x="936" y="478" font-size="13" font-weight="bold" fill="#222">What each role sees</text>
  <g font-size="12" fill="#222">
    <text x="936" y="500"><tspan font-weight="bold">Owner:</tspan>  everything shown on this page.</text>
    <text x="936" y="520"><tspan font-weight="bold">Member:</tspan>  tasks and filters; no 3, no manual</text>
    <text x="1000" y="535">progress, no Remove or role selects, no 10.</text>
    <text x="936" y="555"><tspan font-weight="bold">Viewer:</tspan>  read only; no New task, no edits;</text>
    <text x="1000" y="570">the members list is visible, without controls.</text>
    <text x="936" y="590" fill="#555">All names and numbers are sample data.</text>
  </g>

  <!-- ============ OTHER STATES AND DIALOGS ============ -->
  <text x="20" y="650" font-size="16" font-weight="bold" fill="#222">Other states and dialogs</text>

  <!-- A: New task form with a validation error -->
  <rect x="20" y="665" width="400" height="240" fill="#ffffff" stroke="#444" stroke-width="1.5"/>
  <text x="36" y="690" font-size="14" font-weight="bold" fill="#222">New task form, with a validation error</text>
  <text x="36" y="714" font-size="12" fill="#222">Title *</text>
  <rect x="36" y="720" width="340" height="28" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="46" y="739" font-size="13" fill="#222">ab</text>
  <text x="36" y="764" font-size="11" fill="#c0392b">Title must be between 3 and 150 characters.</text>
  <text x="36" y="783" font-size="12" fill="#222">Description</text>
  <rect x="36" y="789" width="340" height="26" rx="4" fill="#ffffff" stroke="#444"/>
  <rect x="36" y="824" width="160" height="26" rx="4" fill="#ffffff" stroke="#444"/>
  <text x="46" y="842" font-size="12" fill="#222">Status: To do</text>
  <text x="182" y="842" font-size="10" fill="#222">v</text>
  <rect x="206" y="824" width="170" height="26" rx="4" fill="#ffffff" stroke="#444"/>
  <text x="216" y="842" font-size="12" fill="#222">Priority: Medium</text>
  <text x="362" y="842" font-size="10" fill="#222">v</text>
  <rect x="36" y="862" width="110" height="28" rx="4" fill="#cfcfcf" stroke="#444"/>
  <text x="91" y="881" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Create task</text>
  <rect x="156" y="862" width="80" height="28" rx="4" fill="#ffffff" stroke="#444"/>
  <text x="196" y="881" font-size="13" text-anchor="middle" fill="#222">Cancel</text>
  <text x="250" y="872" font-size="11" fill="#555">Input is kept on error;</text>
  <text x="250" y="886" font-size="11" fill="#555">no double submit.</text>

  <!-- B: Delete project confirmation -->
  <rect x="440" y="665" width="400" height="240" fill="#ffffff" stroke="#444" stroke-width="1.5"/>
  <text x="456" y="690" font-size="14" font-weight="bold" fill="#222">Delete project: confirmation</text>
  <rect x="456" y="705" width="368" height="140" rx="6" fill="#f7f7f7" stroke="#444" stroke-width="2"/>
  <text x="472" y="732" font-size="14" font-weight="bold" fill="#222">Delete "Website redesign"?</text>
  <text x="472" y="755" font-size="12" fill="#222">Its 12 tasks, comments, assignments and</text>
  <text x="472" y="771" font-size="12" fill="#222">members will be permanently deleted.</text>
  <text x="472" y="787" font-size="12" fill="#222">This cannot be undone.</text>
  <rect x="472" y="804" width="130" height="30" rx="4" fill="#cfcfcf" stroke="#444"/>
  <text x="537" y="824" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Delete project</text>
  <rect x="612" y="804" width="80" height="30" rx="4" fill="#ffffff" stroke="#444"/>
  <text x="652" y="824" font-size="13" text-anchor="middle" fill="#222">Cancel</text>
  <text x="456" y="868" font-size="11" fill="#555">Cancel changes nothing (AC-11.2). A failed deletion shows</text>
  <text x="456" y="883" font-size="11" fill="#555">an error, never a success message (AC-11.5).</text>

  <!-- C: Empty and no-result states -->
  <rect x="860" y="665" width="400" height="240" fill="#ffffff" stroke="#444" stroke-width="1.5"/>
  <text x="876" y="690" font-size="14" font-weight="bold" fill="#222">Empty and no-result states</text>
  <rect x="876" y="702" width="368" height="86" fill="#ffffff" stroke="#999" stroke-dasharray="4 3"/>
  <text x="1060" y="728" font-size="14" text-anchor="middle" fill="#222">No tasks yet.</text>
  <rect x="980" y="738" width="160" height="28" rx="4" fill="#cfcfcf" stroke="#444"/>
  <text x="1060" y="757" font-size="12" font-weight="bold" text-anchor="middle" fill="#222">Create the first task</text>
  <text x="876" y="803" font-size="11" fill="#555">The button is shown to Owner and Member; a Viewer sees only the text.</text>
  <rect x="876" y="815" width="368" height="60" fill="#ffffff" stroke="#999" stroke-dasharray="4 3"/>
  <text x="1060" y="840" font-size="14" text-anchor="middle" fill="#222">No tasks match the filters.</text>
  <text x="1060" y="862" font-size="12" text-anchor="middle" fill="#222" text-decoration="underline">Clear filters</text>
  <text x="876" y="893" font-size="11" fill="#555">A filter with no result is not an error (AC-09.3).</text>
</svg>
