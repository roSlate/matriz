# Matriz with Docker Compose. Copy .env.example to .env first.
#   docker compose up -d db     only the database, for working on the code (backend and frontend run on the host)
#   docker compose up -d        the whole application: database, backend and web (http://localhost:8088)

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-matriz}
      POSTGRES_USER: ${POSTGRES_USER:-matriz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - matriz_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The Spring Boot backend. Not published: only the web service reaches it, on the compose network.
  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-matriz}
      DB_USER: ${POSTGRES_USER:-matriz}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      # "dev" also loads the fictional demo data. Leave it empty in a real deployment.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # nginx: serves the built frontend and forwards /api to the backend. The only service the user opens.
  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ | grep -q '<title>Matriz</title>'"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  matriz_db:
