# Continuous integration for Matriz.
# On every push and pull request: build and test the backend and the frontend, and only when both
# pass, build the Docker images and smoke-test the whole stack. Nothing is published and no secret
# is used: the only credential below is a throwaway password created for the run.
name: CI

on:
  push:
  pull_request:

# Minimal permissions: the workflow can only read the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build and tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # The integration tests start a temporary PostgreSQL container (Testcontainers); the
      # runner provides Docker. A failing test fails this job.
      - name: Build and test
        working-directory: backend
        run: mvn -B verify

  frontend:
    name: Frontend (type check, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build

  docker:
    name: Docker images and smoke test
    # The images are built only after the required checks have passed.
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create the configuration (a throwaway password, not a secret)
        run: |
          cp .env.example .env
          sed -i 's/change-me-locally/ci-only-password/g' .env
      - name: Validate the compose file
        run: docker compose config -q
      - name: Build the images
        run: docker compose build
      - name: Start the stack and wait until every service is healthy
        run: docker compose up -d --wait --wait-timeout 240
      - name: Smoke test through the web service
        run: |
          set -euo pipefail
          WEB=http://127.0.0.1:8088
          jar="$(mktemp)"
          # The application shell, also for a path that only the frontend router knows.
          curl -fsS "$WEB/" | grep -q '<title>Matriz</title>'
          curl -fsS "$WEB/projects/1" | grep -q '<title>Matriz</title>'
          # Health of the backend through nginx.
          curl -fsS "$WEB/api/v1/actuator/health" | grep -q '"status":"UP"'
          # Without a session the API answers 401, and hands out the CSRF cookie.
          curl -sS -c "$jar" -o /dev/null -w '%{http_code}\n' "$WEB/api/v1/users/me" | grep -qx 401
          token="$(awk '$6=="XSRF-TOKEN"{print $7}' "$jar")"
          test -n "$token"
          # Log in as a demo user, then read the profile with the session.
          curl -fsS -b "$jar" -c "$jar" -X POST "$WEB/api/v1/auth/login" \
            -H "X-XSRF-TOKEN: $token" -H 'Content-Type: application/json' \
            -d '{"email":"ana@example.org","password":"matriz-demo"}' | grep -q '"name":"Ana Silva"'
          curl -fsS -b "$jar" "$WEB/api/v1/users/me" | grep -q '"email":"ana@example.org"'
          # The list of projects comes from the real database.
          curl -fsS -b "$jar" "$WEB/api/v1/projects" | grep -q '"Website redesign"'
      - name: Logs of the services (only when something failed)
        if: failure()
        run: docker compose logs --tail=100
      - name: Stop the stack
        if: always()
        run: docker compose down -v
