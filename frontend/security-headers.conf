# Security headers for everything nginx serves itself (the pages and the built files).
# The API answers are not touched here: Spring already sets its own headers on them, and a second
# copy of a header such as X-Frame-Options would make browsers ignore it.
#
# The policy allows only this origin: scripts and style sheets must come from the application
# itself, and nothing inline is allowed. The progress bar still works, because React sets its width
# through the DOM (element.style), which a policy does not block; only a style="..." attribute
# written into the HTML would be blocked. The end-to-end tests check both.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
