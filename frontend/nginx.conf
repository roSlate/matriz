# Serves the built application and forwards the API to the backend container, so that the browser
# sees a single address and the session and CSRF cookies work without any cross-origin rules.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Do not tell visitors which nginx version this is.
    server_tokens off;

    # The API. "backend" is the name of the service in compose.yaml.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The single-page application: unknown paths go to index.html and React Router decides.
    location / {
        include security-headers.conf;
        try_files $uri /index.html;
    }

    # Built files have hashed names, so they can be cached for a long time; index.html must not be.
    # A location with its own add_header does not inherit the others, so the security headers are
    # included again in each of these.
    location /assets/ {
        include security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /index.html {
        include security-headers.conf;
        add_header Cache-Control "no-cache";
    }
}
